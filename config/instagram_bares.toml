# Bares (y salas chicas) que programan por Instagram. Ver docs/instagram-bares.md.
#
# Por ahora es solo la lista: todavía no hay nada que la lea. Cuando la API de Meta ande con tu cuenta, una fuente
# va a leer los posts nuevos de cada cuenta y armar borradores para aprobar en la planilla de "Agregá tu evento".
#
# Un bloque [[bar]] por cuenta. Solo `usuario` es obligatorio (sin @); lo demás, si no lo sabés, lo completo yo.
#
#   usuario    el usuario de Instagram, sin @
#   nombre     cómo se llama el lugar
#   corto      cómo se lo nombra en el título ("The Shannon: SPAGUETTI WESTERN"); si no está, sale del nombre del
#              perfil de Instagram, limpio
#   direccion  calle y número
#   barrio     el barrio, como en el sitio
#   lat, lon   coordenadas, si el buscador de direcciones no encuentra el lugar
#              (un evento sin ubicación conocida no se publica)
#   bar        false si no es un bar (una sala, un teatro, un mercado): sus eventos no llevan la etiqueta "Bares"
#   itinerante true si no tiene lugar fijo (una feria, un festival): el lugar sale del 📍 o de la cuenta de un lugar de
#              esta lista que nombre el post ("Plaza ex Terminal Goes centroculturalterminalgoes")
#              Si es un recorrido y no dice de dónde sale, va a la primera parada que se encuentre, con la nota
#              "ubicación aproximada"
#   categoria  si la cuenta hace siempre lo mismo: "tour" (recorridos), "musica", "teatro", "taller"… (las del sitio)
#   por_defecto  el tipo cuando el post no dice qué es: "musica" en un bar de música en vivo ("Jazzterday", "Tony Rey"
#              no dicen "show" ni "banda"). Si el post sí lo dice ("stand up", "fiesta"), manda el post
#   notas      lo que quieras recordar (por ejemplo, "solo los jueves de jazz")

# Correcciones a mano de un borrador: cuando el lugar de una fecha está solo en el afiche, por ejemplo. Va el id del
# borrador (en el aviso de GitHub, al final de cada renglón: <!-- ig:usuario-AAAAMMDD -->) y lo que cambia: lugar, y si
# el buscador no lo encuentra, lat y lon (también se puede poner direccion, barrio o bar = false), titulo (manda sobre
# el aprobado en el aviso) e inicio ("2026-11-28T19:00:00-03:00", si el post confunde el día). Vale solo para esa
# fecha; las demás de la cuenta siguen igual. Están al final de este archivo.

# [[bar]]
# usuario = "nombre_del_bar"
# nombre = "Nombre del Bar"
# direccion = "Calle 1234"
# barrio = "Cordón"

