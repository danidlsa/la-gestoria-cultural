# Bares (y salas chicas) que programan por Instagram. Ver docs/instagram-bares.md.
#
# Por ahora es solo la lista: todavía no hay nada que la lea. Cuando la API de Meta ande con tu cuenta, una fuente
# va a leer los posts nuevos de cada cuenta y armar borradores para aprobar en la planilla de "Agregá tu evento".
#
# Un bloque [[bar]] por cuenta. Solo `usuario` es obligatorio (sin @); lo demás, si no lo sabés, lo completo yo.
#
#   usuario    el usuario de Instagram, sin @
#   nombre     cómo se llama el lugar
#   corto      cómo se lo nombra en el título ("The Shannon: SPAGUETTI WESTERN"); si no está, sale del nombre del
#              perfil de Instagram, limpio
#   direccion  calle y número
#   barrio     el barrio, como en el sitio
#   lat, lon   coordenadas, para los que solo dan una esquina ("Durazno y Jackson"): el buscador de direcciones no
#              encuentra esquinas, y un evento sin ubicación conocida no se publica
#   bar        false si no es un bar (una sala, un teatro, un mercado): sus eventos no llevan la etiqueta "Bares"
#   notas      lo que quieras recordar (por ejemplo, "solo los jueves de jazz")

# [[bar]]
# usuario = "nombre_del_bar"
# nombre = "Nombre del Bar"
# direccion = "Calle 1234"
# barrio = "Cordón"

