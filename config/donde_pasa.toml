# "Dónde pasa": el tipo de lugar de cada sala, para filtrar (por ejemplo, música en bares y salas chicas).
#
# Es una clasificación a mano, por lugar, revisada el 17/11/2026 (el borrador está en docs/borradores/). El criterio:
#   bares       bares y cafés que además tienen shows
#   espacios    espacios culturales: lugares de usos múltiples (shows, talleres, muestras, ferias) que maneja un
#               colectivo, una cooperativa, un centro cultural o una institución, sin ser principalmente una sala
#   chicas      salas de espectáculos de hasta unas 300 personas
#   grandes     salas de más de 300 (teatros grandes, arenas, clubes, hoteles)
#   aire_libre  plazas, parques, rambla, calle. Además de por lugar, se decide por evento (cartelera/donde_pasa.py):
#               el texto lo corrige (una muestra adentro del Molino de Pérez no; una caminata que sale de un museo sí)
#               y, por encima de todo, las listas "si" y "no" de abajo, por link del evento.
# El tamaño sale del aforo publicado cuando existe; si no, va a ojo. Museos, cines, librerías y discotecas no llevan
# etiqueta. Un lugar nuevo queda sin etiqueta (no aparece cuando se filtra por "Dónde pasa") hasta sumarlo acá.
# Van los id de los lugares (como en datos/lugares.json). Un lugar con eventos que no está en ningún grupo (ni en
# no_aplica) entra en el aviso de GitHub "Lugares sin «Dónde pasa»", para sumarlo acá.

