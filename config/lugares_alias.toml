# Lugares que aparecen con distintos nombres según la fuente.
# Es la única parte mantenida a mano: configuración, no carga de eventos.
# Cada nombre (y sus alias) se compara sin tildes ni mayúsculas.

[[lugar]]
id = "auditorio-nacional-del-sodre"
nombre = "Auditorio Nacional del Sodre"
# La Sala Hugo Balzo está adentro del Auditorio (Andes y Mercedes).
alias = ["Auditorio Adela Reta", "Auditorio Nacional del Sodre Dra. Adela Reta", "Auditorio Nacional Adela Reta", "Sodre",
         "Sala Hugo Balzo", "Sodre-Salga Hugo Balzo", "Sodre - Sala Hugo Balzo"]

[[lugar]]
id = "auditorio-nelly-goitino"
nombre = "Auditorio Nelly Goitiño"
# El Sodre y Tickantel le dicen así; la cartelera de la Intendencia, "del SODRE - Sala Héctor Tosar" (la sala de adentro).
alias = ["Auditorio Nelly Goitiño del SODRE", "Auditorio Nelly Goitiño del Sodre", "Sala Héctor Tosar"]
direccion = "Av. 18 de Julio 930"

