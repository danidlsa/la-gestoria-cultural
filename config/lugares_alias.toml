# Actividades municipales que se hacen en muchos barrios a la vez (ver scrapers/portal_im.py).
# No hay un lugar único: el punto del mapa es la Intendencia (su explanada), que las organiza. `solo_por_nombre` evita que
# se le sumen, por cercanía, los eventos que sí son en la Intendencia (el Atrio, por ejemplo).
[[lugar]]
id = "varios-barrios-de-montevideo"
nombre = "Varios barrios de Montevideo"
alias = []
solo_por_nombre = true
# Unos 80 m al noreste del edificio (la explanada), para no tapar el punto de los eventos en la Intendencia.
lat = -34.90600
lon = -56.18550

# Casa de Juan Zorrilla de San Martín, en Punta Carretas. No es el Espacio Zorrilla (Cerrito 475, Ciudad Vieja):
# sin las palabras genéricas los dos nombres quedan iguales, por eso se asigna solo por nombre.
[[lugar]]
id = "museo-zorrilla"
nombre = "Museo Zorrilla"
alias = ["Museo Casa de Zorrilla", "Museo Juan Zorrilla de San Martín"]
solo_por_nombre = true
direccion = "José Luis Zorrilla de San Martín 96, Punta Carretas"
lat = -34.92763
lon = -56.15977

# La sala de teatro está dentro del museo: un solo lugar con el nombre del museo.
[[lugar]]
id = "museo-torres-garcia"
nombre = "Museo Torres García"
alias = ["Teatro del Museo - Museo Torres García", "Teatro del Museo Torres García"]
direccion = "Sarandí 683"
lat = -34.90646
lon = -56.20138

# Plaza en el predio de la antigua Estación Agraciada (Arroyo Seco). No está en OpenStreetMap: las coordenadas
# son las de su ficha en Google Maps (2/11/2026), confirmadas sobre Av. Agraciada.
[[lugar]]
id = "plaza-de-las-pioneras"
nombre = "Plaza de las Pioneras"
alias = ["Las Pioneras", "Espacio Las Pioneras", "Espacio Feminista Las Pioneras", "Plaza Las Pioneras"]
direccion = "Av. Agraciada, Arroyo Seco"
lat = -34.88435
lon = -56.19304

# Entraste lo escribe de las dos formas (6/11/2026).
[[lugar]]
id = "vou-club"
nombre = "VOU Club"
