# Noche de las Librerías 2026: su dirección es una esquina y OpenStreetMap no la encuentra. Ubicación tomada de
# su ficha en Google Maps (7/11/2026). El mapa de la Intendencia dice "Buceo", pero queda en Bolívar.
[[lugar]]
id = "biblioteca-popular-el-cantaro-fresco"
nombre = "Biblioteca Popular El Cántaro Fresco"
alias = ["Biblioteca El Cántaro Fresco", "El Cántaro Fresco"]
direccion = "Altamirano esquina Luis Alberto de Herrera"
lat = -34.8714543
lon = -56.162738
barrio = "Bolívar"

# Sitio, el espacio de conciertos del Parque Roosevelt: queda en Canelones (Ciudad de la Costa), pero es casi
# Montevideo y se suma igual (9/11/2026). Ubicación: el parque, según OpenStreetMap.
[[lugar]]
id = "sitio-parque-roosevelt"
nombre = "Sitio · Parque Roosevelt"
alias = ["Sitio", "SITIO - Parque Roosevelt", "Sitio Parque Roosevelt", "SITIO"]
direccion = "Parque Roosevelt, Ciudad de la Costa (Canelones)"
lat = -34.8591365
lon = -56.0217968
barrio = "Parque Roosevelt (Canelones)"
solo_por_nombre = true
