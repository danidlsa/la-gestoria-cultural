# Eventos especiales: jornadas de una vez por año con muchas actividades a la vez.
#
# `activo = false` apaga la pestaña "Especiales" y los avisos.
activo = true

# Qué especiales se muestran en la pestaña (por su `id`), en este orden. Se eligen a mano, uno por vez: el que
# viene y tiene programa. Los demás quedan guardados acá abajo, sin mostrarse (y sin avisos).
mostrar = ["noche-de-las-librerias"]

# `sitio` no se muestra en la web (varios no eran el sitio correcto): solo va en el aviso interno, para revisar.
# `pagina` sí se muestra: es la página oficial del programa. `pestana` y `pestana_corta` son el nombre de la pestaña
# (en la compu y en la barra de abajo del celular, donde reemplaza a "Mapa" mientras se muestra); `icono`, su dibujo;
# `enlace`, el atajo para difundirlo (lagestoriacultural.uy/<enlace>). Con `mapa` (el id de un mapa de Google My Maps),
# `desde` y `horario`, la fuente "mapas_especiales" lee el programa del mapa y cada actividad es un evento.
# La pestaña "Especiales" muestra cada uno con su próxima fecha y, cuando aparece el programa en las fuentes,
# con sus actividades. Un mes antes, si todavía no hay nada, GitHub Actions abre un issue para avisar.
#
# Cómo se calcula la fecha (una de estas, de más segura a menos):
#   desde / hasta = 2027-10-02 / 2027-10-03     fecha anunciada: va primero y se borra cuando pasa
#   regla = "semana_de_turismo"                 de lunes a domingo de la Semana de Turismo (Semana Santa)
#   regla = "dia_del_mes", mes, dia, ordinal, dias
#                                               por ejemplo, el primer sábado de octubre y el día siguiente
#   regla = "meses", meses = [11]               solo se sabe el mes: la fecha queda "a confirmar"
#
# `palabras` son expresiones regulares (sin tildes, sin mayúsculas) que se buscan en el título del evento
# y en el de su ciclo. Solo cuentan los eventos con alguna función dentro de las fechas del especial.

[[especial]]
id = "dia-del-patrimonio"
nombre = "Día del Patrimonio"
descripcion = "Más de 500 lugares de todo el país abren sus puertas gratis: edificios públicos, casas, iglesias, teatros y recorridos guiados."
cuando = "el primer fin de semana de octubre"
regla = "dia_del_mes"
mes = 10
dia = "sabado"
ordinal = 1
dias = 2
sitio = "https://www.gub.uy/ministerio-educacion-cultura/patrimonio-uruguay"
palabras = ["dia del patrimonio", "\\bpatrimonio 20\\d\\d"]

[[especial]]
id = "museos-en-la-noche"
nombre = "Museos en la Noche"
descripcion = "Más de cien museos y espacios abren de noche, con entrada libre, espectáculos y visitas especiales."
cuando = "un viernes de diciembre (suele ser el segundo)"
regla = "dia_del_mes"
mes = 12
dia = "viernes"
ordinal = 2
dias = 1
sitio = "https://museos.uy/"
palabras = ["museos en la noche"]

[[especial]]
id = "noche-de-las-librerias"
nombre = "La Noche de las Librerías"
descripcion = "Librerías de toda la ciudad abiertas hasta tarde, con presentaciones de libros, charlas, música, talleres y propuestas para chicos."
cuando = "un viernes de noviembre"
regla = "meses"
meses = [11]
sitio = "https://eventos.montevideo.gub.uy/nochelibrerias"
palabras = ["noche de (las )?librerias"]
# Edición 2026: el programa está en un mapa de Google de la Intendencia (fuente "mapas_especiales").
desde = 2026-11-13
horario = ["19:00", "01:00"]
lugares = "librerías"  # cómo se llaman los lugares en la pestaña ("41 librerías")
enlace = "librerias"  # atajo para difundir: lagestoriacultural.uy/librerias lleva directo a la pestaña
pestana_corta = "Librerías"  # en la barra de abajo del celular, donde entra poco
icono = "libro"
pagina = "https://eventos.montevideo.gub.uy/nochelibrerias"
mapa = "1unh4KD7uo9wdVfES4n5EXEobNB1S4HA"

[[especial]]
id = "montevideo-mas-museos"
nombre = "Montevideo + Museos"
