[[especial]]
id = "sabados-en-ciudad-vieja"
nombre = "Sábados en Ciudad Vieja"
descripcion = "Actividades culturales, gastronómicas y artísticas en las calles de Ciudad Vieja, casi todas gratis: música en vivo, ferias, visitas guiadas y recorridos. Organiza la Intendencia con el Municipio B, comerciantes y organizaciones del barrio."
cuando = "el tercer sábado de cada mes"
regla = "cada_mes"
dia = "sabado"
ordinal = 3
# La edición que se muestra (se elige a mano): cuando pasa, la pestaña se va sola y no salta al mes siguiente.
# Para mostrar otra, se cambia la fecha (el tercer sábado de ese mes) y se pone en `mostrar`.
desde = 2026-11-21
sitio = "https://eventos.montevideo.gub.uy/sabadosenciudadvieja"
pagina = "https://eventos.montevideo.gub.uy/sabadosenciudadvieja"
# Las actividades llegan por el portal de eventos de la Intendencia (fuente "portal_im"), con este ciclo.
palabras = ["sabados en ciudad vieja"]
horario = ["12:00", "20:00"]  # el horario oficial del afiche de la IM (algunas actividades empiezan antes o terminan después)
lugares = "lugares"
enlace = "ciudadvieja"  # lagestoriacultural.uy/ciudadvieja lleva directo a la pestaña
pestana = "Sábados en Ciudad Vieja"
pestana_corta = "Ciudad Vieja"
grilla = false  # sin vista grilla: casi todo dura horas, la lista por lugar alcanza
barrio = "Ciudad Vieja"  # el barrio de los lugares que no lo tienen cargado
vista = "tipo"  # todo queda a pocas cuadras: el programa por tipo de evento, no por lugar
filtros = false  # y sin filtros (ni buscador)
# El portal de la IM pone en "Artes escénicas" el teatro, la danza y hasta las milongas: el bloque se llama así.
nombres_tipo = { teatro = "Artes escénicas" }
