[project]
name = "cartelera"
version = "0.1.0"
description = "Cartelera cultural de Montevideo armada con scraping"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "python-dateutil>=3.0.0",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
