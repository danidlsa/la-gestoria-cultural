                "performer": "",
                "description": "Tenía apenas un año y seis meses. ¿Con un año y seis meses, qué sentimientos se pueden generar? ¿Qué afectos, qué vínculos se pueden llegar a tener? Seguramente muchos. Pero si hablamos de recuerdos, tangibles, patentes, yo no tuve ninguno.     &quot;Cartografía sobre la identidad&quot; aborda el proceso de construcción de la identidad de Mariana Zaffaroni, secuestrada en Argentina en 1976, cuando tenía apenas 18 meses, junto a sus padres, uruguayos detenidos desaparecidos.     Gracias a la búsqueda incansable de su familia biológica, a los 17 años le fue restituida su verdadera identidad. Mariana, quien hasta ese momento llevaba el nombre de Daniela Furci, comenzó un proceso profundamente complejo de reconstrucción personal, familiar y emocional que continúa hasta el día de hoy.    La obra forma parte de una trilogía que reflexiona sobre tres de las principales consecuencias del terrorismo de Estado durante la última dictadura civil-militar: el asesinato, la apropiación de niños y niñas y la desaparición forzada. En el marco de los 50 años del secuestro de Mariana, este proyecto invita a reflexionar sobre las huellas que estos crímenes dejaron en las personas, las familias y la sociedad.    Nos gusta pensar en la verdad como un valor inseparable de la construcción de la identidad, tanto de las personas como de un país.",

                "description": "KINGARUTS llega junto a THE LIONS FULL BAND para presentar en vivo su álbum  debut, “INTRO FULL ÁLBUM”, producido por Gianni Maggioli (La Floresta Crew)  y gestado durante seis años de trabajo entre Uruguay y Argentina.  El show será mucho más que la presentación de un disco: será un encuentro de  música, energía positiva y celebración, una oportunidad para compartir con el  público todo el camino recorrido y dar la bienvenida a una nueva etapa.    “INTRO FULL ÁLBUM” cuenta con la participación de destacados músicos de la  escena rioplatense: Iván Mustapich en batería; Willy Rangone y Manuel Fernández,    integrantes de Los Cafres, en vientos; y Osvel Costa en mezcla y  mastering, reconocido ingeniero de audio argentino que ha trabajado junto a  Charly García, Fito Páez y Patricio Rey y sus Redonditos de Ricota, además  de participar en el histórico álbum Oktubre.  El escenario será el punto de encuentro entre todo lo vivido y todo lo que está por  venir: el cierre de un ciclo de seis años y el comienzo de una nueva etapa.  Una noche para celebrar la música, el camino compartido y la energía que nace  cuando artistas y público se encuentran.",

                "description": "Ellas están en la mesa, son un cuadro familiar. Todas las actrices son Lady.  Susurran, se ocultan y se dejan ver. Juegan con la luz, Avanzan, hablan a coro, en canon, superponen sus palabras. Se  corrigen. Son actrices en medio de un gran teatro, son Lady Macbeth en el patio del castillo, son cantantes de tango, son  brujas en medio de un aquelarre.  “Última noche con Lady”, indaga la ausencia de la mujer en los lugares de poder. Una obra que permite un ejercicio  coral, una voz multiplicada, muchos cuerpos que son uno solo. Un juego entre la realidad y la ficción, atravesado por  temáticas absolutamente vigentes. Elementos del ayer anclados en el hoy.  La experiencia personal llevada a la escena. Ser Lady Macbeth en el Río de la Plata, en una ciudad del interior,  en un país al sur del sur, del sur.    Dramaturgia: Lucía Trentini.  Dirección: Giancarlo Trentini.  Elenco: Myriam Rodríguez, Natalia Fumero Casas, Magdalena Salazar, Paz Feijó, Lucía Rosano, Matilde Pérez,  Natalia Menéndez y Adriana Sendic.  Equipo Técnico: Agustín Frusto, Leandro González y Giancarlo Trentini.  Producción: Pequeño Teatro de Durazno.  APTA PARA MAYORES DE 13 AÑOS",
